name: Update Project State (Gitea)

# Gitea-compatible variant of update-state.yml.
# Runs when a PR is merged into main.
# Same logic as the GitHub Actions version, but uses Gitea REST API instead
# of `gh` CLI, since `gh` is GitHub-specific.
#
# To use:
#   1. Place this file at .gitea/workflows/update-state.yml
#   2. Delete the GitHub version (.github/workflows/update-state.yml)
#   3. Ensure your Gitea runner is set up and has GITEA_TOKEN with repo write scope
#
# Branch naming expected: feat/[module-slug]-phase[N]-[description]-US-XXX

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  update-state:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Parse branch name
        id: parse
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Branch: $BRANCH"

          if [[ "$BRANCH" =~ ^feat/([a-z0-9-]+)-phase([5-8])-.+-US-([0-9]+)$ ]]; then
            MODULE="${BASH_REMATCH[1]}"
            PHASE="${BASH_REMATCH[2]}"
            STORY="US-${BASH_REMATCH[3]}"
            echo "module=$MODULE"  >> "$GITHUB_OUTPUT"
            echo "phase=$PHASE"    >> "$GITHUB_OUTPUT"
            echo "story=$STORY"    >> "$GITHUB_OUTPUT"
            echo "should_update=true" >> "$GITHUB_OUTPUT"
            echo "✅ Parsed: module=$MODULE, phase=$PHASE, story=$STORY"
          else
            echo "⚠️  Branch name doesn't match expected pattern."
            echo "   Expected: feat/[module]-phase[5-8]-[description]-US-XXX"
            echo "   Got:      $BRANCH"
            echo "should_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update project-state.md
        if: steps.parse.outputs.should_update == 'true'
        env:
          MODULE: ${{ steps.parse.outputs.module }}
          PHASE:  ${{ steps.parse.outputs.phase }}
          STORY:  ${{ steps.parse.outputs.story }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          STATE_FILE="docs/project-state.md"

          if [ ! -f "$STATE_FILE" ]; then
            echo "❌ $STATE_FILE not found. Cannot update state."
            exit 1
          fi

          # Same Python logic as the GitHub variant — markdown editing only,
          # no platform-specific calls.
          python3 << 'PYEOF'
          import os
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          state_path = Path("docs/project-state.md")
          module = os.environ["MODULE"]
          phase  = int(os.environ["PHASE"])
          story  = os.environ["STORY"]
          pr_num = os.environ["PR_NUM"]

          content = state_path.read_text(encoding="utf-8")
          today   = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M")

          # Update phases column for this story
          story_row_pattern = rf'^(\| {re.escape(story)} \|.*?\|.*?\|.*?\| )([☐✓\s]+)( \|.*)$'

          def row_replacer(line_match):
              prefix      = line_match.group(1)
              phases_part = line_match.group(2)
              suffix      = line_match.group(3)
              boxes = re.findall(r'[☐✓]', phases_part)
              if len(boxes) == 4:
                  boxes[phase - 5] = '✓'
                  new_phases = ' '.join(boxes)
                  return f"{prefix}{new_phases}{suffix}"
              return line_match.group(0)

          content = re.sub(
              story_row_pattern,
              row_replacer,
              content,
              flags=re.MULTILINE,
          )

          # Update story status
          row_match = re.search(
              rf'\| {re.escape(story)} \|[^\n]*',
              content,
          )
          if row_match:
              row = row_match.group(0)
              done_count = row.count('✓')
              new_status = "open" if done_count == 0 else ("closed" if done_count == 4 else "in-progress")
              updated_row = re.sub(
                  rf'(\| {re.escape(story)} \| [^|]* \| [^|]* \| )[^|]*( \|)',
                  rf'\g<1>{new_status}\g<2>',
                  row,
              )
              content = content.replace(row, updated_row, 1)

          # Update module status if phase 8
          if phase == 8:
              module_row_pattern = rf'(\| [^|]+\| `?{re.escape(module)}`? \| )[^|]*( \|)'
              content = re.sub(
                  module_row_pattern,
                  rf'\g<1>phase 8 done (module live)\g<2>',
                  content,
              )

          # Recent activity
          activity_entry = f"[{today}] state: {story} phase {phase} merged (PR #{pr_num})"
          activity_block = re.search(
              r'(## Recent activity\s*\n.*?```\n)(.*?)(```)',
              content,
              flags=re.DOTALL,
          )
          if activity_block:
              header  = activity_block.group(1)
              entries = activity_block.group(2).strip().split('\n') if activity_block.group(2).strip() else []
              closer  = activity_block.group(3)
              entries.insert(0, activity_entry)
              entries = entries[:10]
              new_block = header + '\n'.join(entries) + '\n' + closer
              content = content.replace(activity_block.group(0), new_block)

          state_path.write_text(content, encoding="utf-8")
          print(f"✅ Updated {state_path}: {story} phase {phase} → done")
          PYEOF

      - name: Commit state update
        if: steps.parse.outputs.should_update == 'true'
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions@users.noreply.gitea.local"

          if git diff --quiet docs/project-state.md; then
            echo "No changes to commit."
            exit 0
          fi

          STORY="${{ steps.parse.outputs.story }}"
          PHASE="${{ steps.parse.outputs.phase }}"

          git add docs/project-state.md
          git commit -m "state: $STORY phase $PHASE merged"
          git push origin main

      - name: Find linked issue number
        if: steps.parse.outputs.should_update == 'true'
        id: find_issue
        env:
          STORY:           ${{ steps.parse.outputs.story }}
          GITEA_TOKEN:     ${{ secrets.GITEA_TOKEN }}
          GITEA_SERVER:    ${{ vars.GITEA_SERVER_URL }}
          REPO_OWNER:      ${{ github.repository_owner }}
          REPO_NAME:       ${{ github.event.repository.name }}
        run: |
          # Search Gitea for an open issue with the story ID in its title
          ISSUE_NUM=$(
            curl -s \
              -H "Authorization: token ${GITEA_TOKEN}" \
              "${GITEA_SERVER}/api/v1/repos/${REPO_OWNER}/${REPO_NAME}/issues?state=open&type=issues&q=${STORY}" \
            | python3 -c "
          import sys, json, os
          story = os.environ['STORY']
          issues = json.load(sys.stdin)
          for issue in issues:
              if story in issue.get('title', ''):
                  print(issue['number'])
                  break
          "
          )

          if [ -n "$ISSUE_NUM" ]; then
            echo "issue_number=$ISSUE_NUM" >> "$GITHUB_OUTPUT"
            echo "Found issue #$ISSUE_NUM for $STORY"
          else
            echo "issue_number=" >> "$GITHUB_OUTPUT"
            echo "No open issue found for $STORY"
          fi

      - name: Update or close issue
        if: steps.parse.outputs.should_update == 'true' && steps.find_issue.outputs.issue_number != ''
        env:
          STORY:        ${{ steps.parse.outputs.story }}
          PHASE:        ${{ steps.parse.outputs.phase }}
          ISSUE_NUM:    ${{ steps.find_issue.outputs.issue_number }}
          PR_NUM:       ${{ github.event.pull_request.number }}
          GITEA_TOKEN:  ${{ secrets.GITEA_TOKEN }}
          GITEA_SERVER: ${{ vars.GITEA_SERVER_URL }}
          REPO_OWNER:   ${{ github.repository_owner }}
          REPO_NAME:    ${{ github.event.repository.name }}
        run: |
          BASE_URL="${GITEA_SERVER}/api/v1/repos/${REPO_OWNER}/${REPO_NAME}"

          # Fetch current issue body
          ISSUE_BODY=$(
            curl -s \
              -H "Authorization: token ${GITEA_TOKEN}" \
              "${BASE_URL}/issues/${ISSUE_NUM}" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['body'])"
          )

          # Tick the matching phase checkbox
          UPDATED_BODY=$(echo "$ISSUE_BODY" | python3 -c "
          import sys, re, os
          phase = os.environ['PHASE']
          body  = sys.stdin.read()
          pattern = rf'^- \[ \] (\*\*Phase {phase} )'
          body = re.sub(pattern, rf'- [x] \1', body, flags=re.MULTILINE)
          print(body, end='')
          ")

          # Update the issue body (PATCH)
          UPDATED_BODY_JSON=$(python3 -c "
          import sys, json
          body = sys.stdin.read()
          print(json.dumps({'body': body}))
          " <<< "$UPDATED_BODY")

          curl -s -X PATCH \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$UPDATED_BODY_JSON" \
            "${BASE_URL}/issues/${ISSUE_NUM}" > /dev/null

          # Add a comment
          curl -s -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"✅ Phase ${PHASE} merged (PR #${PR_NUM}). State updated.\"}" \
            "${BASE_URL}/issues/${ISSUE_NUM}/comments" > /dev/null

          # If phase 8, close the issue
          if [ "$PHASE" = "8" ]; then
            curl -s -X POST \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"body\": \"All four phases complete. Closing.\"}" \
              "${BASE_URL}/issues/${ISSUE_NUM}/comments" > /dev/null

            curl -s -X PATCH \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"state": "closed"}' \
              "${BASE_URL}/issues/${ISSUE_NUM}" > /dev/null

            echo "✅ Issue #${ISSUE_NUM} closed (all phases done)"
          fi
